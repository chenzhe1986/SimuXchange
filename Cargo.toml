[workspace]
resolver = "2"
members = [
    "crates/simx-core",
    "crates/simx-server",
    "crates/simx-update-server",
    "src-tauri",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
chrono = "0.4"
parking_lot = "0.12"

[profile.release]
opt-level = 2
lto = true
