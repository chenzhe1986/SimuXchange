[workspace]
resolver = "2"
members = [
    "crates/simx-core",
    "crates/simx-server",
    "crates/simx-update-server",
    "crates/simx-cli",
    "src-tauri",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
chrono = "0.4"
parking_lot = "0.12"
# Lua 解释器（"Lua 脚本回报"模式用）：
# - lua54 + vendored：内置编译 Lua 5.4 C 源码（构建需要 C 编译器：
#   Windows 用 MSVC 自带 cl.exe；Linux musl 交叉编译需 musl-gcc，
#   见 scripts/build-all.ps1 与构建调试手册）
# - send：让 Lua 状态可跨线程移动（Send），从而能放进 SessionCtx 的
#   parking_lot::Mutex 缓存里被任意连接任务取用
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }
# XML 解析（深交所 ETF 实时申购赎回清单 pcf_*.xml 的读取）
quick-xml = "0.41"
# SQL Server 异步驱动（上海综合网关 EzSTEP 数据库接口用）：
# - 纯 Rust TDS 协议实现，不依赖 ODBC/msodbcsql，Windows/Linux/musl 均可编译；
# - 固定 0.12.x：其 rustls 依赖 rustls 0.21 + ring（纯 Rust/汇编，交叉编译友好）；
#   0.13 会拉入 aws-lc-rs（需要 CMake/NASM），会让 Linux musl 打包变复杂
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "rustls", "tokio"] }
# tokio 与 tiberius 的 I/O 适配（TokioAsyncWriteCompatExt）
tokio-util = { version = "0.7", features = ["compat"] }

[profile.release]
opt-level = 2
lto = true
