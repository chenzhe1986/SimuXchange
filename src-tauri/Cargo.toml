[package]
name = "simuxchange"
version = "1.0.0"
edition = "2021"
description = "SimuXchange 模拟撮合网关"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
simx-core = { path = "../crates/simx-core" }
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# 更新下载用：轻量 HTTP 客户端（仅 http，不启用 TLS，内网更新服务器足够）
ureq = { version = "2", default-features = false }

[features]
# 发布版默认启用 custom-protocol：将 dist 前端资源嵌入 exe；
# dev 模式由 Tauri CLI 以 --no-default-features 运行，加载 devUrl
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
