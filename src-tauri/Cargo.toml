[package]
name = "simuxchange"
version = "1.2.0"
edition = "2021"
description = "SimuXchange 模拟撮合网关"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
simx-core = { path = "../crates/simx-core" }
tauri = { version = "2", features = [] }
# 单实例：重复启动时不再开第二个进程，改为唤起已有实例的窗口
tauri-plugin-single-instance = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# 轻量 HTTP 客户端：更新下载只需 http；"AI 生成脚本"的模型接口是 https。
# 注意 ureq 的 native-tls 特性只编译实现、不会自动启用（rustls 才是默认后端），
# 必须在代码里 AgentBuilder::tls_connector(...) 显式挂上（见 main.rs 的 llm_chat）；
# native-tls 在 Windows 走系统 schannel，纯 Rust 绑定无 C 编译负担
ureq = { version = "2", default-features = false, features = ["native-tls", "json"] }
native-tls = "0.2"
# 更新文件完整性校验（updater.rs 下载后核对 sha256）
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# 更新器等主进程退出：OpenProcess + WaitForSingleObject（updater.rs）
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[features]
# 发布版默认启用 custom-protocol：将 dist 前端资源嵌入 exe；
# dev 模式由 Tauri CLI 以 --no-default-features 运行，加载 devUrl
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]